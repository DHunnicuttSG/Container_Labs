name: ecommerce

topology:
  nodes:

    br-public:
      kind: bridge

    br-private:
      kind: bridge

    router:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      network-mode: none
      exec:
        - ip addr add 10.10.10.1/24 dev eth1
        - ip addr add 10.20.20.1/24 dev eth2
        - ip link set eth1 up
        - ip link set eth2 up
        - sysctl -w net.ipv4.ip_forward=1

    web:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      network-mode: none
      ports:
        - 8080:80
      exec:
        - ip addr add 10.10.10.10/24 dev eth1
        - ip link set eth1 up
        - ip route add default via 10.10.10.1

    db:
      kind: linux
      image: ghcr.io/hellt/network-multitool
      network-mode: none
      exec:
        - ip addr add 10.20.20.10/24 dev eth1
        - ip link set eth1 up
        - ip route add default via 10.20.20.1

  links:

    - endpoints:
        - web:eth1
        - br-public

    - endpoints:
        - router:eth1
        - br-public

    - endpoints:
        - db:eth1
        - br-private

    - endpoints:
        - router:eth2
        - br-private